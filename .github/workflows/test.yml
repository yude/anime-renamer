name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Install media tools for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

  ffmpeg7:
    runs-on: ubuntu-latest
    container: debian:13-slim
    steps:
      - name: Install build and media tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev ffmpeg

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record media tool version
        run: ffmpeg -version

      - name: Test with FFmpeg 7 and race detector
        run: go test -race ./...
